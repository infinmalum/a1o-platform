name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web_build:
    name: Build frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, studio]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.27.1'
      - run: go test -mod=readonly -cover ./...

  commit_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect funding-only push
        id: funding
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            exit 0
          fi
          paths=$(git log --format= --name-only --no-renames --diff-merges=first-parent "${BEFORE}..${GITHUB_SHA}" -- | sed '/^$/d' | sort -u)
          if [[ "$paths" == '.github/FUNDING.yml' ]]; then
            echo 'only=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: wagoid/commitlint-github-action@v6
        if: steps.funding.outputs.only != 'true'
