services:
  a1o-platform:
    extends:
      file: docker-compose.external.yml
      service: a1o-platform
    environment:
      SQL_DSN: postgres://a1o@postgres:5432/a1o_platform?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting bundled PostgreSQL}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${REGISTRY:-docker.io}/postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: a1o
      POSTGRES_DB: a1o_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting bundled PostgreSQL}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "a1o", "-d", "a1o_platform"]
      interval: 5s
      timeout: 3s
      retries: 12
