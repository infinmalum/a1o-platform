version: '3.4'

services:
  a1o-platform:
    build: .
    image: a1o-platform:local
    container_name: a1o-platform
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data/a1o-platform:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=a1o:${MYSQL_PASSWORD:-a1o}@tcp(db:3306)/a1o-platform  # 修改此行，或注释掉以使用 SQLite 作为数据库
      - REDIS_CONN_STRING=redis://redis
      - SESSION_SECRET=random_string  # 修改为随机字符串
      - TZ=Asia/Shanghai
#      - INITIAL_ROOT_PASSWORD=change-me  # 不设置时首次打开控制台会进入 /setup 向导创建管理员；无头部署必须设置该变量
#      - NODE_TYPE=slave  # 多机部署时从节点取消注释该行
#      - SYNC_FREQUENCY=60  # 需要定期从数据库加载数据时取消注释该行
#      - FRONTEND_BASE_URL=https://your-domain.com  # 多机部署时从节点取消注释该行
    depends_on:
      - redis
      - db
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'" ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: "${REGISTRY:-docker.io}/redis:latest"
    container_name: redis
    restart: always

  db:
    image: "${REGISTRY:-docker.io}/mysql:8.2.0"
    restart: always
    container_name: mysql
    volumes:
      - ./data/mysql:/var/lib/mysql  # 挂载目录，持久化存储
    ports:
      - '3306:3306'
    environment:
      TZ: Asia/Shanghai   # 设置时区
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-a1o_root} # 设置 root 用户的密码，生产环境务必通过环境变量覆盖
      MYSQL_USER: a1o   # 创建专用用户
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-a1o}    # 专用用户密码，需与上方 SQL_DSN 一致
      MYSQL_DATABASE: a1o-platform   # 自动创建数据库
